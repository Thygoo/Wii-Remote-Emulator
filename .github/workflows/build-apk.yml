
name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Prepare v0.3 Android sources
        run: |
          cp MainActivity.kt app/src/main/java/org/example/wiiremote/MainActivity.kt
          cp WiiHidSession.kt app/src/main/java/org/example/wiiremote/WiiHidSession.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          sed -i 's/versionCode = 2/versionCode = 3/' app/build.gradle.kts
          sed -i 's/versionName = "0.2"/versionName = "0.3"/' app/build.gradle.kts


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiiRemote-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
